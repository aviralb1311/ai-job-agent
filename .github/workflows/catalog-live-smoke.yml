name: Catalog live feed validation

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/api/src/jobs/source-catalog.ts"
      - "apps/api/src/jobs/catalog-live-smoke.ts"
      - "apps/api/src/jobs/connectors/**"
      - ".github/workflows/catalog-live-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-public-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npm run db:generate
      - name: Validate every catalog board against its public provider API
        run: npm run test:catalog-live -w @job-agent/api
        env:
          SOURCE_TIMEOUT_MS: 20000
