name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate
        env:
          DATABASE_URL: file:./dev.db

      - name: Build all workspaces
        run: npm run build

      - name: Prepare SQLite integration database
        run: npm run db:push
        env:
          DATABASE_URL: file:./integration-test.db

      - name: Run API tests
        run: npm run test
        env:
          DATABASE_URL: file:./integration-test.db

      - name: Audit production and development dependencies
        run: npm audit
