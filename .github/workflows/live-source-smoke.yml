name: Live public source smoke test

on:
  workflow_dispatch:
    inputs:
      greenhouse_board:
        description: Greenhouse public board ID (not a URL)
        required: true
        type: string
      lever_site:
        description: Lever public site slug (not a URL)
        required: true
        type: string
      ashby_board:
        description: Ashby public job board name (not a URL)
        required: true
        type: string

permissions:
  contents: read

jobs:
  live-source-smoke:
    name: Validate live public job feeds
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Smoke test live public job boards through application connectors
        run: npm run test:live-sources -w @job-agent/api
        env:
          GREENHOUSE_SMOKE_BOARD: ${{ inputs.greenhouse_board }}
          LEVER_SMOKE_BOARD: ${{ inputs.lever_site }}
          ASHBY_SMOKE_BOARD: ${{ inputs.ashby_board }}
          SOURCE_TIMEOUT_MS: 20000
